name: build-win64
on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Public URL of the qualified 1.34 Windows x64 archive
        required: true
        type: string
      candidate_sha256:
        description: Reviewed archive SHA256
        required: true
        type: string
      candidate_version:
        description: Expected candidate version
        default: '1.34.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  genuine-windows-import:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import candidate through official OpenCPN CLI
        shell: pwsh
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: python ci/verify-windows-x64-import.py --url "$env:CANDIDATE_URL" --sha256 "$env:CANDIDATE_SHA256" --version "$env:CANDIDATE_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-windows-import-evidence
          path: windows-import-evidence/**/import-acceptance.json
